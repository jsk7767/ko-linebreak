name: tests
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: checker self-check on fixture (expects exit 1)
        run: |
          python scripts/check.py tests/fixtures/sample_bad.html --json > out.json || true
          python -c "import json; j=json.load(open('out.json')); assert j['must']>=5, j"
